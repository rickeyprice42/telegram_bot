<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top AI Card</title>
  <style>
    :root {
      --bg-1: #09111f;
      --bg-2: #13233d;
      --panel: rgba(12, 20, 36, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f4f7fb;
      --muted: #9eb0c8;
      --accent: #74f2ce;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(116, 242, 206, 0.16), transparent 32%),
        radial-gradient(circle at top right, rgba(255, 204, 102, 0.15), transparent 26%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .frame {
      width: 1200px;
      min-height: 760px;
      margin: 0 auto;
      padding: 48px;
      position: relative;
      overflow: hidden;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(10px);
      opacity: 0.55;
    }

    .frame::before {
      width: 280px;
      height: 280px;
      top: -80px;
      right: -20px;
      background: radial-gradient(circle, rgba(255, 204, 102, 0.45), transparent 70%);
    }

    .frame::after {
      width: 320px;
      height: 320px;
      left: -90px;
      bottom: -120px;
      background: radial-gradient(circle, rgba(116, 242, 206, 0.28), transparent 70%);
    }

    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 36px;
    }

    .eyebrow {
      display: inline-flex;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--accent);
      font-size: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title {
      margin: 18px 0 10px;
      font-size: 62px;
      line-height: 0.95;
      letter-spacing: -0.04em;
      max-width: 700px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 24px;
      max-width: 560px;
      line-height: 1.4;
    }

    .badge {
      padding: 18px 22px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      min-width: 210px;
    }

    .badge-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .badge-value {
      font-size: 38px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.95fr 0.95fr;
      gap: 20px;
      align-items: stretch;
    }

    .logo-wrapper {
      --logo-ratio: 1;
      width: clamp(112px, calc(132px * var(--logo-ratio)), 228px);
      height: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .logo-wrapper.is-wide {
      width: clamp(136px, calc(144px * var(--logo-ratio)), 248px);
    }

    .logo-wrapper.is-tall {
      width: 156px;
    }

    .tool-card {
      position: relative;
      border-radius: 32px;
      padding: 26px;
      background: rgba(12, 20, 36, 0.72);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      min-height: 420px;
      overflow: hidden;
    }

    .rank-1 {
      background:
        linear-gradient(160deg, rgba(255, 204, 102, 0.14), rgba(12, 20, 36, 0.76) 45%),
        rgba(12, 20, 36, 0.72);
    }

    .rank-2 {
      background:
        linear-gradient(160deg, rgba(220, 230, 242, 0.12), rgba(12, 20, 36, 0.76) 45%),
        rgba(12, 20, 36, 0.72);
    }

    .rank-3 {
      background:
        linear-gradient(160deg, rgba(242, 161, 102, 0.13), rgba(12, 20, 36, 0.76) 45%),
        rgba(12, 20, 36, 0.72);
    }

    .tool-rank {
      display: inline-flex;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .tool-visual {
      margin-top: 28px;
      margin-bottom: 28px;
      height: 188px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .tool-logo,
    .tool-logo-fallback {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      overflow: hidden;
      object-position: center;
      display: block;
    }

    .tool-logo {
      object-fit: cover;
    }

    .tool-logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: var(--text);
      background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    }

    .tool-name {
      margin: 0 0 14px;
      font-size: 38px;
      line-height: 1.02;
      letter-spacing: -0.03em;
    }

    .tool-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .meta-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--muted);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="frame">
    <section class="hero">
      <div>
        <div class="eyebrow">AI Ranking</div>
        <h1 class="title">{{ category_name }}</h1>
        <p class="subtitle">Auto-generated showcase card for the three strongest tools in this category.</p>
      </div>
      <div class="badge">
        <div class="badge-label">Snapshot</div>
        <div class="badge-value">Top 3</div>
      </div>
    </section>

    <section class="grid">
      {{ cards }}
    </section>
  </main>
  <script>
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    const syncLogoWrappers = () => {
      document.querySelectorAll(".logo-wrapper").forEach((wrapper) => {
        const image = wrapper.querySelector(".tool-logo");
        if (!image) {
          return;
        }

        const applyRatio = () => {
          if (!image.naturalWidth || !image.naturalHeight) {
            return;
          }

          const ratio = image.naturalWidth / image.naturalHeight;
          wrapper.style.setProperty("--logo-ratio", clamp(ratio, 0.72, 1.72).toFixed(3));
          wrapper.classList.toggle("is-wide", ratio > 1.18);
          wrapper.classList.toggle("is-tall", ratio < 0.9);
        };

        if (image.complete) {
          applyRatio();
        } else {
          image.addEventListener("load", applyRatio, { once: true });
        }
      });
    };

    window.addEventListener("load", syncLogoWrappers);
  </script>
</body>
</html>
